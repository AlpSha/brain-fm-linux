name: Release

# Fires when scripts/release.sh pushes a vX.Y.Z tag. Creates the GitHub release,
# finalizes the AUR PKGBUILD checksum, publishes to the AUR, and syncs the
# finalized PKGBUILD/.SRCINFO back to the default branch.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check for AUR key
        id: aurkey
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AUR_SSH_PRIVATE_KEY not set — skipping AUR publish. See README → One-time CI setup."
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: brain-fm ${{ env.VERSION }}
          generate_release_notes: true

      - name: Finalize PKGBUILD (pkgver + checksum)
        run: |
          set -euo pipefail
          archive="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          echo "Downloading $archive"
          sha=$(curl -fsSL --retry 5 --retry-all-errors "$archive" | sha256sum | cut -d' ' -f1)
          echo "sha256=$sha"
          sed -i -E "s/^pkgver=.*/pkgver=${VERSION}/"            aur/PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/"                     aur/PKGBUILD
          sed -i -E "s/^sha256sums=.*/sha256sums=('${sha}')/"    aur/PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/aur:/in:ro" archlinux:base-devel bash -c '
            useradd -m b
            cp /in/PKGBUILD /home/b/PKGBUILD
            chown -R b /home/b
            cd /home/b && sudo -u b makepkg --printsrcinfo' > aur/.SRCINFO
          echo "--- .SRCINFO ---"; cat aur/.SRCINFO

      - name: Publish to the AUR
        if: steps.aurkey.outputs.present == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: brain-fm
          pkgbuild: aur/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: alp@sahin.club
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
          ssh_keyscan_types: rsa,ed25519

      - name: Sync PKGBUILD + .SRCINFO back to master
        run: |
          set -euo pipefail
          if git diff --quiet -- aur/PKGBUILD aur/.SRCINFO; then
            echo "Nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aur/PKGBUILD aur/.SRCINFO
          git commit -m "chore(aur): finalize checksums for v${VERSION} [skip ci]"
          git push origin HEAD:master
